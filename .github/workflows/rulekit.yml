# Legacy compatibility workflow: manual only; current automation uses the v4 engine.
# 放到仓库 .github/workflows/rulekit.yml；rulekit/ 整个目录放在仓库根下
name: rulekit daily build

on:
  workflow_dispatch:
    inputs:
      force:
        description: "跳过变化量保护（确认上游大改正常后再用）"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write   # actions/cache 读写上游缓存用

concurrency:
  group: rulekit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 上游抓取缓存存在 actions/cache，不进 git（仓库不膨胀）；
      # key 带 run_id：每次恢复上一次的、跑完存一份新的
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: rulekit/cache
          key: rulekit-cache-${{ github.run_id }}
          restore-keys: |
            rulekit-cache-

      - name: Build
        working-directory: rulekit
        env:
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python3 build.py

      # 构建失败时 dist/ 不变；把失败报告作为产物留存，GitHub 会给你发失败邮件
      - name: Upload failed report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rulekit-failed-report
          path: rulekit/dist/REPORT.failed.md
          if-no-files-found: ignore

      - name: Commit
        run: |
          git config user.name  "rulekit-bot"
          git config user.email "rulekit-bot@users.noreply.github.com"
          # 一次性：之前误提交进 git 的 rulekit/cache 不再跟踪（工作区文件保留）
          git rm -r -q --cached rulekit/cache/ 2>/dev/null || true
          # 只提交 dist：cache 由上面的 actions/cache 管
          git add rulekit/dist
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "rulekit: $(date -u -d '+8 hour' '+%Y-%m-%d %H:%M') CST 自动更新"
            # 先 rebase 再 push：避免手动 push 撞上 Action 运行时被拒
            git pull --rebase origin main
            git push
          fi
