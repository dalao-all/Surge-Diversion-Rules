  # 银行与支付
  "bm:AliPay", "bm:UnionPay", "bm:ICBC", "bm:CCB", "bm:CMB", "mc:citic",
  # 通讯
  "bm:WeChat", "bm:DingTalk", "bm:Tencent",
  # 娱乐
  "bm:DouYin", "bm:KuaiShou", "bm:XiaoHongShu", "bm:BiliBili", "bm:Weibo", "bm:NetEaseMusic",
  "bm:TencentVideo", "bm:iQIYI", "bm:ByteDance", "bm:Coolapk",
  # 购物
  "bm:Alibaba", "bm:JingDong", "bm:Pinduoduo", "bm:XianYu", "bm:MeiTuan", "bm:Eleme",
  "bm:ZhuanZhuan", "mc:dewu",
  # 地图 / 出行 / 汽车
  "bm:GaoDe", "bm:12306", "bm:XieCheng", "mc:dongchedi", "bm:Geely",
  # 国内 AI
  "mc:deepseek",
  # 生活 / 工作
  "bm:ChinaMobile", "bm:XiaoMi", "bm:Huawei", "bm:NetEase",
  "mc:liepin", "mc:qcc", "mc:lianjia", "mc:intsig",
  "custom/cn-extra.list",
]
# blackmatrix7 的大集合把域名拆在 _Domain 文件里
extra_files = ["bm:Alibaba_Domain", "bm:Tencent_Domain"]
